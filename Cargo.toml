[package]
name = "DMsender"
version = "0.2.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
inquire = "0.7"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
md5 = "0.7"
